; =============================================================================
;  php.ini — batas unggah berkas untuk aplikasi desa
; =============================================================================
;  Kenapa berkas ini ada?
;
;  Formulir pengajuan surat menerima beberapa dokumen sekaligus (KTP, KK,
;  surat pengantar RT/RW, foto tempat usaha). Validasi aplikasi mengizinkan
;  hingga 10 MB per berkas (StorePengajuanRequest: `max:10240`, dan
;  `maks_kb` per persyaratan). Bila PHP di server memakai batas bawaan yang
;  lebih kecil (sering 2 MB), warga akan melihat galat validasi yang
;  membingungkan padahal berkasnya wajar — hasil pindai KTP dari ponsel
;  biasanya 3-6 MB.
;
;  Nilai di bawah sengaja sedikit lebih longgar daripada batas aplikasi:
;  aplikasi tetap yang memutuskan berkas diterima atau tidak, PHP hanya
;  tidak boleh memotongnya lebih dulu.
;
;  Berkas ini dibaca oleh image PHP di Railway/Railpack dan oleh php-fpm
;  pada VPS bila disalin ke direktori konfigurasi PHP.
; =============================================================================

; Satu berkas: aplikasi mengizinkan 10 MB, beri ruang 12 MB.
upload_max_filesize = 12M

; Total seluruh isi satu permintaan (beberapa dokumen + data formulir).
; Harus lebih besar dari upload_max_filesize, jika tidak unggahan ditolak
; sebelum sampai ke aplikasi.
post_max_size = 64M

; Menyusun berkas .docx surat dan membaca gambar kop membutuhkan memori
; lebih dari bawaan 128 MB.
memory_limit = 256M

; Mengunggah beberapa berkas di koneksi desa yang lambat butuh waktu.
max_execution_time = 120
max_input_time = 120

; Jangan tampilkan galat PHP ke pengunjung. Aplikasi menanganinya sendiri
; lewat APP_DEBUG=false dan halaman galat Laravel.
display_errors = Off
log_errors = On

; Zona waktu mengikuti WIB agar tanggal surat benar.
date.timezone = Asia/Jakarta
